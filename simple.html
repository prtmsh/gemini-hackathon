<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #0a0a0a;
            --accent: #fff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Lock scroll for the gallery feel */
        }

        /* --- INPUT MODAL --- */
        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(30px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }

        .input-box {
            width: 380px; text-align: center;
        }

        h1 { font-weight: 300; letter-spacing: -1px; margin-bottom: 30px; opacity: 0.8; }

        .input-field {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: transparent; border: none; border-bottom: 1px solid #333;
            color: #fff; font-family: inherit; font-size: 1rem; text-align: center;
            outline: none; transition: border-color 0.3s;
        }
        .input-field:focus { border-bottom-color: #fff; }

        .file-label {
            display: block; padding: 30px; border: 1px dashed #333;
            border-radius: 12px; cursor: pointer; color: #666; margin-bottom: 30px;
            transition: 0.3s; font-size: 0.9rem;
        }
        .file-label:hover { border-color: #fff; color: #fff; background: var(--glass); }
        input[type="file"] { display: none; }

        .btn-action {
            background: #fff; color: #000; border: none; padding: 16px 40px;
            border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-action:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        /* --- THE GALLERY (Row of 4) --- */
        #gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 100%;
            height: 100vh;
            padding: 0 40px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* --- PHONE CARD (9:16) --- */
        .ad-card {
            width: 280px; /* Fixed width */
            aspect-ratio: 9/16; /* Mobile Ratio */
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            border: 1px solid #1a1a1a;
            
            /* Floating Animation */
            animation: float 8s ease-in-out infinite;
        }
        
        /* Staggered floating delays are set in JS */

        .ad-card:hover { 
            transform: translateY(-10px) scale(1.05); 
            z-index: 10; 
            border-color: #555;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* CARD LAYERS */
        .art-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8; z-index: 0;
            transition: transform 10s ease;
        }
        /* Slow subtle zoom on hover */
        .ad-card:hover .art-layer { transform: scale(1.1); }
        
        .art-layer svg { width: 100%; height: 100%; object-fit: cover; }

        .product-layer {
            position: absolute; 
            top: 50%; left: 50%; width: 85%;
            transform: translate(-50%, -50%);
            z-index: 2; 
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.7));
            transition: transform 0.4s ease;
        }
        .ad-card:hover .product-layer { transform: translate(-50%, -55%) scale(1.05); }

        .text-layer {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 30px 20px; box-sizing: border-box;
            background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.8) 40%, transparent 100%);
            z-index: 3;
            text-align: center;
        }

        .location-tag {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
            opacity: 0.8; margin-bottom: 10px; display: block; font-weight: 700;
        }
        
        .headline {
            font-size: 1.6rem; line-height: 1.1; font-weight: 700; margin: 0 0 8px 0;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subline { font-size: 0.8rem; color: #ccc; font-weight: 300; line-height: 1.4; }

        /* --- DOWNLOAD BUTTON --- */
        #download-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 1s ease 1s; pointer-events: none;
        }
        #download-container.visible { opacity: 1; pointer-events: auto; }

        .btn-secondary {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 25px; border-radius: 30px; cursor: pointer;
            font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-secondary:hover { background: #fff; color: #000; }

        /* --- LOADING --- */
        .loader {
            display: none; width: 100%; text-align: center; color: #666; font-size: 0.8rem;
            margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .loader span { animation: pulse 0.8s infinite alternate; }

    </style>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body>

    <div id="setup-overlay">
        <div class="input-box">
            <h1>Create Ad Matrix</h1>
            
            <input type="password" id="apiKey" class="input-field" placeholder="Paste API Key">
            <input type="text" id="prompt" class="input-field" value="Late night food cravings" placeholder="Campaign Context">
            
            <label class="file-label">
                <input type="file" id="imageFile" accept="image/*">
                <span id="fileName">Drop Product Image Here</span>
            </label>

            <button id="generateBtn" class="btn-action">Ignite</button>
            <div class="loader" id="loader"><span>Designing 4 Variations...</span></div>
        </div>
    </div>

    <div id="gallery"></div>

    <div id="download-container">
        <button id="downloadBtn" class="btn-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download HTML
        </button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const overlay = document.getElementById('setup-overlay');
        const gallery = document.getElementById('gallery');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('imageFile');
        const fileNameSpan = document.getElementById('fileName');
        const downloadContainer = document.getElementById('download-container');

        // File name update
        fileInput.addEventListener('change', (e) => {
            if(e.target.files[0]) fileNameSpan.innerText = e.target.files[0].name;
        });

        const fileToPart = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } });
            reader.readAsDataURL(file);
        });

        const fileToSrc = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(file);
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value;
            const context = document.getElementById('prompt').value;
            const file = fileInput.files[0];

            if(!apiKey || !file) return alert("Key and Image required.");

            document.getElementById('generateBtn').style.display = 'none';
            loader.style.display = 'block';

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });

                const imagePart = await fileToPart(file);
                const imageSrc = await fileToSrc(file);

                const prompt = `
                Role: Senior Creative Director India.
                Context: ${context}.
                
                TASK:
                Create exactly 4 distinct ad variations for:
                1. Mumbai (Hinglish/Marathi trend)
                2. Bangalore (Startup/Tech/Kannada trend)
                3. Delhi (Punjabi/Hinglish Loud trend)
                4. Chennai (Tanglish/Movie trend)

                REQUIREMENTS:
                1. **Copy:** Short, Punchy Headline (2-4 words) in local dialect using ENGLISH ALPHABETS (Transliterated).
                2. **Visuals:** Write **SVG CODE** for a modern, abstract background pattern.
                3. **Colors:** Extract 1 dominant neon accent color.

                OUTPUT JSON:
                [
                    {
                        "city": "Mumbai",
                        "headline": "Kya Bolti Public!",
                        "subline": "The ultimate snack for local train rides.",
                        "svg": "<svg...>...</svg>",
                        "color": "#ff0000"
                    }
                    ... (4 items total)
                ]
                `;

                const result = await model.generateContent([prompt, imagePart]);
                const text = result.response.text();
                const json = JSON.parse(text.replace(/```json|```/g, '').trim());

                renderGallery(json, imageSrc);

            } catch (e) {
                console.error(e);
                alert("Error: " + e.message);
                location.reload();
            }
        });

        function renderGallery(data, imgSrc) {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);

            gallery.innerHTML = '';
            
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'ad-card';
                // Random float delay to make them look organic
                card.style.animationDelay = `-${index * 1.5}s`;

                card.innerHTML = `
                    <div class="art-layer" style="color: ${item.color}">${item.svg}</div>
                    <img src="${imgSrc}" class="product-layer">
                    <div class="text-layer">
                        <span class="location-tag" style="color: ${item.color}">${item.city}</span>
                        <div class="headline">${item.headline}</div>
                        <div class="subline">${item.subline}</div>
                    </div>
                `;
                gallery.appendChild(card);
            });

            setTimeout(() => {
                gallery.style.opacity = '1';
                downloadContainer.classList.add('visible');
            }, 500);
        }

        // --- DOWNLOAD FUNCTIONALITY ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const docClone = document.documentElement.cloneNode(true);
            
            // 1. Remove Input Overlay from clone
            const overlayClone = docClone.querySelector('#setup-overlay');
            if(overlayClone) overlayClone.remove();

            // 2. Remove Download Button from clone (clean view)
            const btnClone = docClone.querySelector('#download-container');
            if(btnClone) btnClone.remove();

            // 3. Ensure Gallery is visible in clone
            const galleryClone = docClone.querySelector('#gallery');
            galleryClone.style.opacity = '1';

            // 4. Create File
            const htmlContent = `<!DOCTYPE html>\n<html lang="en">\n${docClone.innerHTML}\n</html>`;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Gemini_Ad_Campaign.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

    </script>
</body>
</html>
