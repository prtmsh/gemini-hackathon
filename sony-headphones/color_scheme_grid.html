<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony XM5 - Pan India Campaign</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Inter:wght@300;600&family=Noto+Sans+Tamil:wght@400;900&family=Noto+Sans+Devanagari:wght@400;900&family=Noto+Sans+Telugu:wght@400;900&family=Noto+Sans+Malayalam:wght@400;900&family=Noto+Sans+Kannada:wght@400;900&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            overflow-x: auto;
            overflow-y: auto;
        }

        h1 {
            position: fixed;
            top: 20px;
            left: 40px;
            color: white;
            z-index: 1000;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        /* GRID LAYOUT FOR VARIANTS */
        #gallery-container {
            display: grid;
            grid-template-columns: repeat(5, 360px); /* 5 Languages */
            grid-gap: 40px;
            padding: 80px 40px 40px 40px;
            width: max-content;
        }

        /* --- THEME WRAPPER --- */
        .ad-wrapper {
            width: 360px;
            height: 640px;
            /* Default variables, overridden by JS */
            --bg-color: #000;
            --accent-color: #58a6ff;
            --traffic-color: #ff3333;
            --text-color: #fff;
            
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        /* --- UI ELEMENTS --- */
        
        .top-bar {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 50; display: flex; align-items: center; justify-content: flex-end;
            padding: 0 20px; box-sizing: border-box;
        }

        .sony-logo-img {
            height: 18px; width: auto; opacity: 0.9;
            filter: invert(1);
        }

        .play-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 200; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.2s;
        }
        .play-btn:hover { background: rgba(255, 255, 255, 0.4); }

        .icon-shape { width: 12px; height: 14px; background: #fff; pointer-events: none; }
        .icon-pause { border-left: 4px solid #fff; border-right: 4px solid #fff; width: 4px; background: transparent; box-sizing: content-box; }
        .icon-play { clip-path: polygon(0 0, 0% 100%, 100% 50%); }

        /* --- SCENES --- */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
        }

        .sparks-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        .industrial-text {
            font-size: 5rem; color: #d1d1d1; text-transform: uppercase;
            line-height: 1; font-weight: 900; position: absolute; mix-blend-mode: overlay;
        }
        
        .traffic-line {
            width: 120%; height: 2px; 
            background: var(--traffic-color); 
            position: absolute;
            box-shadow: 0 0 10px var(--traffic-color); 
            transform: rotate(-15deg);
        }
        
        .traffic-text {
            font-weight: 700; font-size: 2.5rem; 
            color: var(--traffic-color);
            background: var(--bg-color); 
            padding: 0 10px; z-index: 2; text-align: center;
        }

        /* --- PRODUCT STYLES --- */
        .product-img {
            width: 280px; height: auto; position: absolute; top: 15%;
            z-index: 5; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.9));
        }

        .sony-text-container {
            z-index: 10; text-align: center; position: absolute; bottom: 60px; width: 100%;
        }

        .product-name {
            font-family: 'Inter', sans-serif; font-size: 0.9rem; letter-spacing: 4px;
            color: #aaa; margin-bottom: 5px; text-transform: uppercase;
        }

        .final-copy {
            font-size: 1.8rem; font-weight: 400; color: #fff;
            text-align: center; line-height: 1.2;
        }

        .highlight {
            color: var(--accent-color); 
            font-weight: 700; display: block;
            font-size: 1.8rem; margin-top: 5px;
        }

        .sub-copy {
            font-size: 0.7rem; color: #888; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- FINAL LOGO SCENE STYLES --- */
        .scene-final-logo {
            background-color: var(--bg-color);
            z-index: 20;
        }

        .center-logo-img {
            width: 180px; height: auto;
            filter: invert(1); opacity: 0;
        }

        .progress-bar {
            position: absolute; top: 60px; left: 0; height: 2px;
            background: var(--accent-color); 
            width: 0%; z-index: 100;
        }

        .lang-tag {
            position: absolute; top: 15px; left: 20px;
            color: rgba(255,255,255,0.7); 
            font-size: 0.7rem; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3); 
            padding: 2px 6px; border-radius: 4px;
            z-index: 60;
        }
        
        /* Variant Label (Helper) */
        .variant-label {
            position: absolute; top: -30px; left: 0;
            color: #fff; opacity: 0.5; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <h1>Campaign: Industrial Focus (Multi-Variant Grid)</h1>

    <div id="gallery-container">
        </div>

    <script>
        // --- DATA SETUP ---

        // 1. Languages & Copy
        const campaigns = [
            {
                id: 'hi',
                langName: 'HINDI',
                font: "'Noto Sans Devanagari', sans-serif",
                text: {
                    heat: "ताप",
                    metal: "धातु",
                    thump: "धमक",
                    trafficHeader: "TRAFFIC",
                    // Refined to be complete and negative (Problem)
                    trafficBody: "शिफ्ट ख़त्म।<br>शोर जारी।", 
                    final1: "मेहनत को सम्मान।",
                    final2: "शांति की सुरक्षा।",
                    sub: "शांति के लिए निर्मित"
                }
            },
            {
                id: 'ta',
                langName: 'TAMIL',
                font: "'Noto Sans Tamil', sans-serif",
                text: {
                    heat: "அனல்",
                    metal: "உலோகம்",
                    thump: "அதிர்வு",
                    trafficHeader: "TRAFFIC",
                    trafficBody: "வேலை ஓய்ந்தது.<br>இரைச்சல் ஓயவில்லை.",
                    final1: "உழைப்பிற்கு மரியாதை.",
                    final2: "அமைதியை காத்திடுங்கள்.",
                    sub: "அமைதிக்காகவே உருவானது"
                }
            },
            {
                id: 'te',
                langName: 'TELUGU',
                font: "'Noto Sans Telugu', sans-serif",
                text: {
                    heat: "వేడి",
                    metal: "లోహం",
                    thump: "శబ్దం",
                    trafficHeader: "TRAFFIC",
                    trafficBody: "షిఫ్ట్ అయిపోయింది.<br>గోల ఆగలేదు.",
                    final1: "కష్టానికి గౌరవం.",
                    final2: "ప్రశాంతత మీ సొంతం.",
                    sub: "నిశ్శబ్దం కోసం రూపొందించబడింది"
                }
            },
            {
                id: 'ml',
                langName: 'MALAYALAM',
                font: "'Noto Sans Malayalam', sans-serif",
                text: {
                    heat: "ചൂട്",
                    metal: "ലോഹം",
                    thump: "ശബ്ദം",
                    trafficHeader: "TRAFFIC",
                    trafficBody: "ജോലി കഴിഞ്ഞു.<br>ബഹളം ഒഴിഞ്ഞില്ല.",
                    final1: "അധ്വാനത്തെ മാനിക്കുക.",
                    final2: "സമാധാനം കാക്കുക.",
                    sub: "നിശബ്ദതയ്ക്കായി നിർമ്മിച്ചത്"
                }
            },
            {
                id: 'kn',
                langName: 'KANNADA',
                font: "'Noto Sans Kannada', sans-serif",
                text: {
                    heat: "ಕಾವು",
                    metal: "ಲೋಹ",
                    thump: "ಸದ್ದು",
                    trafficHeader: "TRAFFIC",
                    trafficBody: "ಕೆಲಸ ಮುಗಿದಿದೆ.<br>ಗದ್ದಲ ಮುಗಿದಿಲ್ಲ.",
                    final1: "ಪರಿಶ್ರಮಕ್ಕೆ ಗೌರವ.",
                    final2: "ಶಾಂತಿಯನ್ನು ರಕ್ಷಿಸಿ.",
                    sub: "ಮೌನಕ್ಕಾಗಿ ವಿನ್ಯಾಸಗೊಳಿಸಲಾಗಿದೆ"
                }
            }
        ];

        // 2. Color Schemes (Rows)
        const variants = [
            {
                name: "Original Industrial",
                bg: "#000000",
                accent: "#58a6ff", // Blue
                traffic: "#ff3333", // Red
                sparkBase: [255, 100] // Red/Orange range
            },
            {
                name: "Midnight Blue",
                bg: "#051324",
                accent: "#64ffda", // Teal
                traffic: "#ff0080", // Hot Pink
                sparkBase: [180, 200] // Cyan/Blueish sparks
            },
            {
                name: "Deep Forest",
                bg: "#0A1F0D",
                accent: "#adff2f", // Green Yellow
                traffic: "#ff9100", // Orange
                sparkBase: [60, 100] // Yellow/Green sparks
            },
            {
                name: "Royal Velvet",
                bg: "#1a0b2e",
                accent: "#e0aaff", // Lavender
                traffic: "#00f2ff", // Cyan
                sparkBase: [280, 50] // Purple/Pink sparks
            }
        ];

        const container = document.getElementById('gallery-container');

        // --- FACTORY FUNCTION ---
        function createAdInstance(data, variant) {
            const wrapper = document.createElement('div');
            wrapper.className = 'ad-wrapper';
            wrapper.style.fontFamily = data.font;
            
            // Set CSS Variables for this specific instance based on Variant
            wrapper.style.setProperty('--bg-color', variant.bg);
            wrapper.style.setProperty('--accent-color', variant.accent);
            wrapper.style.setProperty('--traffic-color', variant.traffic);

            wrapper.innerHTML = `
                ${data.id === 'hi' ? `<div class="variant-label">${variant.name}</div>` : ''}
                <div class="top-bar">
                    <img src="image_0.png" class="sony-logo-img" alt="Sony Logo">
                </div>
                <div class="lang-tag">${data.langName}</div>
                <div class="progress-bar"></div>
                <div class="play-btn"><div class="icon-shape icon-pause"></div></div>

                <div class="scene scene-factory" style="opacity: 1;">
                    <canvas class="sparks-canvas" width="360" height="640"></canvas>
                    <div class="industrial-text" style="top: 20%; left: -20px;">${data.text.heat}</div>
                    <div class="industrial-text" style="top: 40%; right: -20px;">${data.text.metal}</div>
                    <div class="industrial-text" style="bottom: 20%; font-size: 6rem; color: #fff; opacity: 0.1;">${data.text.thump}</div>
                </div>

                <div class="scene scene-commute">
                    <div class="traffic-line" style="top: 20%"></div>
                    <div class="traffic-line" style="top: 40%; background: var(--traffic-color); opacity: 0.5; box-shadow: 0 0 10px var(--traffic-color);"></div>
                    <div class="traffic-line" style="top: 60%"></div>
                    <div class="traffic-text">${data.text.trafficHeader}</div>
                    <div class="traffic-text" style="font-size: 1.2rem; color: #fff; margin-top: 20px; line-height: 1.5;">${data.text.trafficBody}</div>
                </div>

                <div class="scene scene-sony">
                    <img src="image_1.png" class="product-img" alt="Headphones">
                    <div class="sony-text-container">
                        <div class="product-name">WH-1000XM5</div>
                        <div class="final-copy">
                            ${data.text.final1}<br>
                            <span class="highlight">${data.text.final2}</span>
                        </div>
                        <div class="sub-copy">${data.text.sub}</div>
                    </div>
                </div>

                 <div class="scene scene-final-logo">
                    <img src="image_0.png" class="center-logo-img" alt="Sony Final Logo">
                </div>
            `;
            
            container.appendChild(wrapper);

            // --- INSTANCE LOGIC ---
            
            // 1. Canvas Animation (Custom Colored Sparks)
            const canvas = wrapper.querySelector('.sparks-canvas');
            const ctx = canvas.getContext('2d');
            let sparks = [];
            let isPaused = false;
            let animFrameId;

            class Spark {
                constructor() {
                    this.x = Math.random() * 360;
                    this.y = Math.random() * 640;
                    this.vx = (Math.random() - 0.5) * 10;
                    this.vy = (Math.random() - 0.5) * 10;
                    this.life = 100;
                    // Dynamic color based on variant parameters
                    // sparkBase = [Hue, Range]
                    const hue = variant.sparkBase[0] + Math.random() * 50; 
                    this.color = `hsla(${hue}, 100%, 50%, 1)`;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= 2;
                    this.vy += 0.5;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animateSparks() {
                if (isPaused) return;
                ctx.clearRect(0, 0, 360, 640);
                if (Math.random() > 0.5) { for(let i=0; i<5; i++) sparks.push(new Spark()); }
                sparks.forEach((s, index) => {
                    s.update(); s.draw();
                    if (s.life <= 0) sparks.splice(index, 1);
                });
                animFrameId = requestAnimationFrame(animateSparks);
            }
            animateSparks();

            // 2. GSAP Animation
            let tl;
            let ctxGsap = gsap.context(() => {
                tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });

                // FACTORY
                tl.to(".scene-factory", { opacity: 1, duration: 0 })
                  .from(".industrial-text", { x: -100, opacity: 0, duration: 0.8, stagger: 0.3, ease: "power4.out" })
                  .to(".industrial-text", { color: "#fff", textShadow: `0 0 20px ${variant.traffic}`, duration: 0.1, repeat: 3, yoyo: true }, "-=0.5")
                  .to(".scene-factory", { filter: "blur(10px)", scale: 1.1, duration: 1, opacity: 0, ease: "power2.in" }, "+=1");

                // COMMUTE
                tl.to(".scene-commute", { opacity: 1, duration: 0 })
                  .from(".traffic-line", { x: "100%", duration: 0.5, stagger: 0.1, ease: "power1.inOut" })
                  .from(".traffic-text", { scale: 0, rotation: 10, duration: 0.4, ease: "back.out(1.7)" })
                  .to(".scene-commute", { x: 5, y: 5, duration: 0.1, repeat: 5, yoyo: true })
                  .to(".scene-commute", { opacity: 0, y: -50, duration: 0.5 }, "+=1.5");

                // SONY PRODUCT
                tl.to(".scene-sony", { opacity: 1, duration: 0.5 })
                  .from(".product-img", { scale: 0.6, opacity: 0, rotationZ: -10, y: 50, duration: 1.5, ease: "expo.out" })
                  .from(".sony-text-container", { y: 20, opacity: 0, duration: 1, ease: "power2.out" }, "-=1")
                  .to(".scene-sony", { duration: 3 })
                  .to(".scene-sony", { opacity: 0, filter: "blur(10px)", duration: 0.8 }); 

                // FINAL LOGO
                tl.to(".scene-final-logo", { opacity: 1, duration: 0.1 }, "-=0.4")
                  .to(".center-logo-img", { opacity: 1, scale: 1, startAt: { scale: 1.5, opacity: 0 }, duration: 1, ease: "expo.out" })
                  .to(".scene-final-logo", { duration: 2 }); 

                // Floating Loop
                gsap.to(wrapper.querySelector(".product-img"), {
                    y: "-=15", rotationZ: 2, duration: 2.5, repeat: -1, yoyo: true, ease: "sine.inOut"
                });

                // Progress Bar
                gsap.to(wrapper.querySelector(".progress-bar"), { width: "100%", duration: tl.duration(), ease: "none", repeat: -1 });
            }, wrapper);

            // 3. Play/Pause
            const btn = wrapper.querySelector('.play-btn');
            const icon = wrapper.querySelector('.icon-shape');
            btn.addEventListener('click', () => {
                isPaused = !isPaused;
                if (isPaused) {
                    tl.pause();
                    icon.classList.remove('icon-pause');
                    icon.classList.add('icon-play');
                    cancelAnimationFrame(animFrameId);
                } else {
                    tl.resume();
                    animateSparks();
                    icon.classList.remove('icon-play');
                    icon.classList.add('icon-pause');
                }
            });
        }

        // --- INIT GRID ---
        // Loop through Variants (Rows) -> Then Languages (Columns)
        variants.forEach(variant => {
            campaigns.forEach(data => {
                createAdInstance(data, variant);
            });
        });

    </script>
</body>
</html>
